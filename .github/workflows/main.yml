name: ci

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print repo tree (top)
        run: |
          pwd
          ls -la
          echo "-----"
          find . -maxdepth 3 -type f | sort | sed -n '1,400p'

      - name: Detect Dockerfile path
        id: detect
        shell: bash
        run: |
          set -e
          if [ -f "./python-docker-dev-example/Dockerfile" ]; then
            echo "context=./python-docker-dev-example" >> "$GITHUB_OUTPUT"
            echo "dockerfile=./python-docker-dev-example/Dockerfile" >> "$GITHUB_OUTPUT"
            echo "Detected subdir Dockerfile"
          elif [ -f "./Dockerfile" ]; then
            echo "context=." >> "$GITHUB_OUTPUT"
            echo "dockerfile=./Dockerfile" >> "$GITHUB_OUTPUT"
            echo "Detected root Dockerfile"
          else
            echo "::error::No Dockerfile found in ./python-docker-dev-example/ or repo root"
            exit 1
          fi
          echo "Context: $(cat $GITHUB_OUTPUT | grep context)"
          echo "Dockerfile: $(cat $GITHUB_OUTPUT | grep dockerfile)"

      - name: Show chosen Dockerfile
        run: |
          echo "CONTEXT: ${{ steps.detect.outputs.context }}"
          echo "DOCKERFILE: ${{ steps.detect.outputs.dockerfile }}"
          echo "----- Dockerfile content -----"
          sed -n '1,200p' "${{ steps.detect.outputs.dockerfile }}"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: k031851
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker / Buildx info
        run: |
          docker version || true
          docker buildx version || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build only (no push) amd64
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.detect.outputs.context }}
          file: ${{ steps.detect.outputs.dockerfile }}
          push: false
          platforms: linux/amd64
          provenance: false
          sbom: false
          build-args: |
            CI=true
          no-cache: true

      - name: Build and push (amd64)
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.detect.outputs.context }}
          file: ${{ steps.detect.outputs.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: |
            k031851/lab-5-part-2:latest
            k031851/lab-5-part-2:${{ github.sha }}
          provenance: false
          sbom: false
