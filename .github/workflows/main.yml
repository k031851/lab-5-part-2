name: ci

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (not strictly needed, but fine)
        uses: actions/checkout@v4

      - name: Sanity check secret
        run: |
          if [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "::error::DOCKERHUB_TOKEN is empty or not configured"
            exit 1
          fi
          echo "Secret looks set."

      # 1) 로그인 검증: login-action + CLI 둘 다 시도해서 메시지를 확실히 남김
      - name: Login via action
        uses: docker/login-action@v3
        with:
          username: hyungjunchoi1
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login via CLI (explicit output)
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u hyungjunchoi1 --password-stdin

      - name: Docker info
        run: |
          docker version
          docker info | sed -n '1,60p'

      # 2) 초미니 테스트 이미지 빌드/푸시 (Dockerfile/경로 문제를 완전히 배제)
      - name: Build tiny test image
        run: |
          mkdir -p /tmp/tiny
          cat > /tmp/tiny/Dockerfile <<'EOF'
          FROM alpine:3.20
          CMD ["echo","hello-from-ci"]
          EOF
          docker build -t hyungjunchoi1/lab-5-part-2:auth-test /tmp/tiny

      - name: Push tiny test image
        run: |
          docker push hyungjunchoi1/lab-5-part-2:auth-test

      # 3) 실제 프로젝트 단일 아키(amd64) 빌드/푸시
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push real image (amd64)
        uses: docker/build-push-action@v6
        with:
          context: ./python-docker-dev-example
          file: ./python-docker-dev-example/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            hyungjunchoi1/lab-5-part-2:latest
            hyungjunchoi1/lab-5-part-2:${{ github.sha }}
